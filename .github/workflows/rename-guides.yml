name: Rename guides to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename files with git mv
        run: |
          set -euo pipefail
          git config user.name "stevesmithecogrants"
          git config user.email "stevesmithecogrants@gmail.com"
          for pair in "solar-panels/heatfund-solar-panels.html solar-panels/index.html" "heat-pumps/heat-pumps.html heat-pumps/index.html" "free-insulation-grants/heatfund-insulation.html free-insulation-grants/index.html" "boiler-upgrade-scheme/heatfund-boiler-upgrade.html boiler-upgrade-scheme/index.html" "battery-storage/heatfund-battery-storage.html battery-storage/index.html" "ev-charger-grants/ev-charger-grants.html ev-charger-grants/index.html" "government-grants/heatfund-government-grants.html government-grants/index.html" "warm-homes-plan-2026/heatfund-warm-homes-plan.html warm-homes-plan-2026/index.html"; do
            set -- $pair
            git rm -q "$2"
            git mv "$1" "$2"
          done
          wc -c solar-panels/index.html heat-pumps/index.html free-insulation-grants/index.html boiler-upgrade-scheme/index.html battery-storage/index.html ev-charger-grants/index.html government-grants/index.html eco4-scheme/index.html warm-homes-plan-2026/index.html
          test $(wc -c < solar-panels/index.html) -gt 60000
          test $(wc -c < heat-pumps/index.html) -gt 60000
          test $(wc -c < free-insulation-grants/index.html) -gt 60000
          test $(wc -c < boiler-upgrade-scheme/index.html) -gt 60000
          test $(wc -c < battery-storage/index.html) -gt 60000
          test $(wc -c < ev-charger-grants/index.html) -gt 60000
          test $(wc -c < government-grants/index.html) -gt 60000
          test $(wc -c < eco4-scheme/index.html) -gt 60000
          test $(wc -c < warm-homes-plan-2026/index.html) -gt 60000
          git status --short
          git commit -m "Rename guide files to index.html (full files)"
          git push
